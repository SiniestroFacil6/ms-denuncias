service: ms-denuncias

provider:
  name: aws
  runtime: java21
  region: us-east-1
  memorySize: 3008
  timeout: 29
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    SPRING_MAIN_LAZY_INITIALIZATION: "true"
    JAVA_TOOL_OPTIONS: "-XX:+TieredCompilation -XX:TieredStopAtLevel=1 --add-opens=java.base/java.lang=ALL-UNNAMED"
    SPRING_DATASOURCE_URL: "jdbc:h2:mem:db_denuncias;DB_CLOSE_DELAY=-1;MODE=MySQL"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
    SPRING_DATASOURCE_USERNAME: "sa"
    SPRING_DATASOURCE_PASSWORD: ""
    SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: "org.hibernate.dialect.H2Dialect"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    LOGGING_FILE_NAME: "/tmp/ms-denuncias.log"

package:
  artifact: target/ms-denuncias-0.0.1-SNAPSHOT-lambda.zip

functions:
  api:
    handler: cl.duoc.siniestrofacil.ms_denuncias.StreamLambdaHandler::handleRequest
    events:
      - httpApi: '*'
