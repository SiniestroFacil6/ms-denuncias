name: Pipeline CI/CD - ms-denuncias (Java 21)

on:
  push:
    branches: [ main ]

jobs:
  ci-build-and-test:
    name: 1. Integracion Continua (Build, Test & Artifact)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_denuncias
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Amazon Corretto)
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Ejecutar pruebas unitarias (JUnit)
        run: mvn test

      - name: Empaquetar aplicacion (.jar)
        run: mvn package -DskipTests

      - name: Guardar artefacto compilado en GitHub
        uses: actions/upload-artifact@v4
        with:
          name: microservicio-jar
          path: target/*.jar

  cd-deploy-aws:
    name: 2. Despliegue Continuo a AWS
    needs: ci-build-and-test  # Solo se ejecuta si el paso 1 sale en verde
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Descargar artefacto .jar generado en el paso anterior
        uses: actions/download-artifact@v4
        with:
          name: microservicio-jar
          path: target/

      - name: Configurar credenciales temporales de AWS Academy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar a AWS Cloud (Serverless)
        run: npx serverless@3.38.0 deploy --stage dev
