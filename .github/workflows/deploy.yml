name: Pipeline CI/CD - ms-denuncias (Java 21)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Compilar y empaquetar proyecto Java con Maven
        run: mvn -B clean package -DskipTests

      - name: Configurar Node.js (necesario para Serverless CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Instalar Serverless Framework globalmente
        run: npm install -g serverless@3.38.0

      - name: Configurar credenciales temporales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Desplegar arquitectura Serverless a AWS Cloud
        run: serverless deploy --stage dev
